<body>
      <textarea name="text" id="userInput"></textarea>
    <button onclick="talk()">Speak</button>





    <script>
        
function talk(){

    const text = document.getElementById('userInput').value;
    const txt_speak = new SpeechSynthesisUtterance(text)

  

    window.speechSynthesis.speak(txt_speak);
}
